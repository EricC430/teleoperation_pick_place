# RECORDED real-robot evaluation of Diffusion Policy ericc430/diffusion_omx_b1_uvc60 (paper cup).
# Trained by configs/train_omx_phase_b1_diffusion.yaml on omx_pick_place_pilot_uvc_60_frontleft_only
# (same 60 paper-cup episodes as the ACT model, wrist camera removed), 40000 steps, EMA weights.
#
#   uv run lerobot-rollout --config_path configs/rollout_omx_b1_diffusion_eval.yaml
#
# KEEP THIS FILE ASCII-ONLY: lerobot's parser opens the YAML with the Windows default
# encoding (cp950) when the config has a path field (policy.path) -> non-ASCII comments crash it.
#
# FRONT-LEFT CAMERA ONLY. The model's input_features are observation.state [6] +
# observation.images.front-left [3,480,848] (read from its Hub config.json 2026-09-18).
# lerobot-rollout would accept an extra wrist camera (context.py only requires the policy's
# cameras to be a subset of the robot's), but it is left out on purpose: the robot then
# observes exactly what the model was trained on, and the laptop does not spend CPU on a
# camera the policy never reads. Consequence: the recorded dataset has no wrist video.
# This model sees 1 camera, the ACT model sees 2 -- not an apples-to-apples comparison.
#
# First run downloads ~1.05 GB (model.safetensors) into D:\hf\hub.
# Inference cost (unverified on the RTX 3050): n_obs_steps=2, horizon=64, n_action_steps=32
# (re-plans every 32 steps = ~2.1 s at 15 fps, ACT re-plans every 100), and
# num_inference_steps=null -> 100 denoising steps per re-plan. Expect longer stalls than ACT;
# watch the "Record loop is running slower" warnings on the first episode.
#
# Episode settings match rollout_omx_b1_uvc60_eval.yaml (ACT) so the two runs are comparable.
# Keys (episodic): Right arrow = end episode / skip reset, Left arrow = discard and redo,
#   Esc = stop the session (saved episodes are kept).
# Dataset name must start with "rollout_"; lerobot appends _YYYYMMDD_HHMMSS. root left unset ->
# D:\hf\lerobot\ericc430\rollout_omx_b1_diffusion_paper_cup_<stamp>.
# Check before every session: nothing to index here (no OpenCV camera); D455 is found by serial.

robot:
  type: omx_follower
  port: COM8
  id: 2026-09-17_omx_follower
  calibration_dir: ./calibration
  cameras:
    front-left:
      type: intelrealsense_pinned
      serial_number_or_name: "262822305610"
      width: 848
      height: 480
      fps: 15
      use_depth: false
      exposure: 400
      gain: 70
      white_balance: null

policy:
  path: ericc430/diffusion_omx_b1_uvc60  # private repo; EMA weights
  noise_scheduler_type: DDIM
  num_inference_steps: 10

strategy:
  type: episodic
  reset_to_initial_position: true   # no teleop: arm goes back to its startup pose between trials

inference:
  type: sync

dataset:
  repo_id: ericc430/rollout_omx_b1_diffusion_paper_cup   # must start with rollout_; timestamp appended
  single_task: "Pick up the object and place it into the box"   # same string as training
  fps: 15                  # must match camera fps
  num_episodes: 36         # same as the ACT eval run
  episode_time_s: 20       # same as the ACT eval run
  reset_time_s: 120        # time to re-place the cup; Right arrow skips the rest
  video: true
  push_to_hub: false       # upload later by hand once the session looks right
  private: true            # personal account: without this a push would be PUBLIC
  streaming_encoding: false
  encoder_threads: 2
  rgb_encoder:
    vcodec: h264
    preset: veryfast
    crf: 23
    pix_fmt: yuv420p

fps: 15
task: "Pick up the object and place it into the box"
display_data: true
return_to_initial_position: true
