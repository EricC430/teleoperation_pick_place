# 2026-10-17 plastic bottle 60 + fldrop30-augfl: the uvc60_augfl_fldrop recipe on the plastic-bottle data.
# Why [柏宇說 2026-10-17]: go straight to a new object instead of another paper-cup closed loop; the dropout should
# make the policy use the wrist view near the object. Expectation [柏宇說]: >= 50% closed loop would be good;
# baseline is act_omx_b4a_plastic_bottle_100k (b6ccbd37e23f) 4/35 on 2026-09-21 (docs/meeting/2026-09-21_bottle_closed_loop.md).
#
# Same as train_omx_uvc60_augfl_fldrop.yaml except the dataset, output_dir and job_name. All 60 episodes, like the
# baseline (configs/train_omx_phase_b4a_plastic_bottle.yaml has no exclude_episodes; the 60 are not annotated, so
# failed demos are unknown). Every episode's gripper action goes below close_below 54 (min 47.4-47.5;
# data/logs/fldrop_check/grip_close_objects.py), so the dropout window is defined for all 60.
#
#   ./scripts/run_container.sh python scripts/train_fl_dropout.py --fl-p 0.3 --fl-window 30 --transforms-fl-only \
#       --config_path configs/train_omx_bottle60_augfl_fldrop.yaml
#
dataset:
  repo_id: ericc430/omx_pick_place_pilot_60_plastic_bottle
  root: /workspace/data/huggingface/lerobot/ericc430/omx_pick_place_pilot_60_plastic_bottle
  eval_split: 0.0
  image_transforms:          # copied from the aug config; with --transforms-fl-only they run on front-left only
    enable: true
    max_num_transforms: 1
    random_order: false
    tfs:
      brightness: {weight: 0.0, type: ColorJitter, kwargs: {brightness: [0.8, 1.2]}}
      contrast: {weight: 0.0, type: ColorJitter, kwargs: {contrast: [0.8, 1.2]}}
      saturation: {weight: 0.0, type: ColorJitter, kwargs: {saturation: [0.5, 1.5]}}
      hue: {weight: 0.0, type: ColorJitter, kwargs: {hue: [-0.05, 0.05]}}
      sharpness: {weight: 0.0, type: SharpnessJitter, kwargs: {sharpness: [0.5, 1.5]}}
      affine: {weight: 1.0, type: RandomAffine, kwargs: {degrees: [-2.0, 2.0], translate: [0.05, 0.05]}}
policy:
  type: act
  chunk_size: 100
  n_action_steps: 100
  push_to_hub: false
output_dir: /workspace/data/train/bottle60_augfl_fldrop_p30_w30
job_name: act_omx_bottle60_augfl_fldrop_p30_w30
steps: 100000
batch_size: 32
save_freq: 20000
eval_steps: 0
log_freq: 50
seed: 1000
num_workers: 12
wandb:
  enable: true
  project: teleoperation_pick_place
