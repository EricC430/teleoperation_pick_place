teleop:
  type: omx_leader
  port: COM9
  id: 2026-09-18_omx_leader
  calibration_dir: ./calibration

robot:
  type: omx_follower
  port: COM8
  id: 2026-09-18_omx_follower
  calibration_dir: ./calibration
  cameras:
    wrist:
      # 🔴 2026-09-13：D405 → Innomaker U20CAM-720P（USB UVC，D022 §2026-09-13）。
      #    換相機 = 場景常數改變 = 重錄邊界 → dataset root 也換了（見下方 dataset.root）。
      # ⚠️ Windows 上的 OpenCV index 不是固定 ID：插拔、重開機、換 USB 孔都可能改變編號。
      #    每個 lab day 開錄前跑 `uv run lerobot-find-cameras opencv`，
      #    確認 outputs/captured_images/opencv_3.png 拍到的是夾爪。
      #    🔴 index 錯了「不會報錯」—— 會安靜地錄到筆電鏡頭（index 0）之類的別台相機。
      type: opencv_uvc  # plugin (D022 §2026-09-13). Revert on trouble: type: opencv (and drop the 3 values below)
      index_or_path: 2
      backend: DSHOW    # index 3 是在 DSHOW 下列舉到的；ANY 在 Windows 可能改選 MSMF，編號不同
      width: 640        # 848×480 不支援：DSHOW 吸附成 800 寬 → lerobot 拒絕開啟（2026-09-13 實測）
      height: 480
      fps: 15           # 相機實際仍送 30 fps；lerobot 只驗 CAP_PROP_FPS，錄製迴圈取最新幀
      fourcc: YUY2      # 640×480 非壓縮就能跑 30 fps，省掉 MJPG 解碼的 CPU
      # 2026-09-13 [柏宇] tune_uvc_exposure.py `f` at the grasp close-up (curtains drawn + ceiling light + desk lamp):
      # exposure/gain pinned from AUTO; white balance stays AUTO. -5 = 31.25 ms (< 1 frame at 30 fps).
      exposure: -5
      gain: 0
      white_balance: null   # = AUTO. Fixed WB leaves a green cast on this camera, no temperature removes it (D022 2026-09-13)
    front-left:
      type: intelrealsense_pinned  # plugin (D022 2026-09-13): null = AUTO, set explicitly on every connect
      serial_number_or_name: "262822305610"
      width: 848        # was 1280 — the 720p stream was the main CPU hog
      height: 480        # was 720
      fps: 15
      use_depth: false
      # 2026-09-13 matched to AUTO (freeze does not hold on this D455; D022): brightness 0.0 %, B/R 4.2 % off.
      # exposure is quantised (power_line_frequency=Auto); 400 is ~40 ms if the unit is 100 us ([AI推論]).
      exposure: 400
      gain: 70
      white_balance: null   # = AUTO: fixed 3500 K looked green (D022 2026-09-13). exposure/gain were matched with WB 3500; re-check with freeze_realsense_exposure.py (--wb auto)

dataset:
  # 寶特瓶補錄 ③ 中遠區精準示範（2026-10-21，柏宇）。D455 在 far_wrist 視角（≈A1，同 10/16–10/18 閉環），只用 t 點。
  #   不轉腕 [柏宇說]：寶特瓶轉腕夾不到；寬度跟夾爪開口差不多，要精準對準。
  #   r_max ≈ 38.3 cm [柏宇說 2026-10-21：遙控試的極限約在 c22（r 38.29、θ +2°）那條半徑；只試了正前方]。
  #   點 = t1–t60 中 22 ≤ r ≤ 38.3 的點，扣掉 ① normal（t16 t21 t4 t2 t20 t45）、② recovery（t34 t12 t17 t36 t9 t35）已錄的，
  #      共 37 點各 1 集 → 中遠區每個 t 點在 ①②③ 合計剛好出現一次。t22（38.57）超過 r_max，不錄。
  #   做法：接近時放慢，等瓶子在手腕畫面正中間才閉合。碰倒或沒夾到 → ← 重錄。
  #   ⚠️ 兩側 t48（+50°）、t47（−52°）、t3（−62°）在 r_max 附近、側邊沒試過：先遙控試，搆不到就跳過並記下來。
  #   順序：從手臂的左邊（θ 正）掃到右邊。episode → 擺放點（r cm / θ°）：
  #     ep  0 t14 (30.3/+61) | ep  1 t32 (32.5/+57) | ep  2 t48 (37.6/+50) | ep  3 t42 (23.8/+48) | ep  4 t26 (33.1/+46)
  #     ep  5 t6  (26.7/+41) | ep  6 t27 (29.8/+38) | ep  7 t33 (32.6/+36) | ep  8 t50 (28.1/+32) | ep  9 t31 (37.5/+28)
  #     ep 10 t18 (31.8/+25) | ep 11 t30 (32.5/+17) | ep 12 t49 (24.6/+17) | ep 13 t13 (28.4/+16) | ep 14 t23 (37.1/+9)
  #     ep 15 t15 (34.4/+6)  | ep 16 t40 (22.3/+5)  | ep 17 t5  (24.6/+2)  | ep 18 t39 (32.8/+2)  | ep 19 t7  (29.8/0)
  #     ep 20 t19 (37.1/−10) | ep 21 t25 (33.2/−13) | ep 22 t1  (27.8/−13) | ep 23 t41 (34.1/−19) | ep 24 t11 (23.2/−19)
  #     ep 25 t8  (29.9/−23) | ep 26 t46 (34.1/−29) | ep 27 t44 (27.7/−31) | ep 28 t29 (26.9/−36) | ep 29 t10 (36.2/−37)
  #     ep 30 t24 (33.3/−41) | ep 31 t28 (22.8/−46) | ep 32 t47 (36.8/−52) | ep 33 t43 (22.1/−62) | ep 34 t3  (35.7/−62)
  #     ep 35 t37 (32.2/−64) | ep 36 t38 (29.1/−65)
  #   錄完寫 episode_meta/<dataset>.csv（placement_id 照上表；跳過的點要記）。
  # 開錄前：① lerobot-find-cameras 確認 wrist index ② scripts/align_camera.py --dataset-root .cache/lerobot/omx_pick_place_pilot_paper_cup_far_wrist_A1 --episodes 1 4 8
  #   （同 10/13 起閉環的參考。10/18 寶特瓶閉環對它：木紋 ≤ 1 px、分界線 +2.5～+6 px，not aligned，2026-10-21 dry-run）
  repo_id: ericc430/omx_pick_place_pilot_plastic_bottle_precise_A1
  root: ./.cache/lerobot/omx_pick_place_pilot_plastic_bottle_precise_A1
  push_to_hub: false       # upload by hand after the session looks right (same as the rollouts)
  num_episodes: 37
  fps: 15                    # must match camera fps
  episode_time_s: 45         # same as uvc_60
  reset_time_s: 120           # was 60 — pilot doesn't need a full minute to reposition
  single_task: "Pick up the object and place it into the box"
  # 🔴 do NOT encode video inside the record loop.
  streaming_encoding: false
  # 🔴 2026-08-31: even non-streaming SVT-AV1 x2 starved the D455 grab thread
  # (frame 530ms stale → TimeoutError). This laptop (AVX2, 5 threads) cannot do
  # 2x RealSense + real-time AV1. Switch to h264/veryfast + cap encoder threads.
  # ⚠️ codec change ≠ resume-compatible with the av1 smoke-test dataset — start a
  # FRESH repo_id/root for the real pilot.
  encoder_threads: 2
  rgb_encoder:
    vcodec: h264
    preset: veryfast
    crf: 23
    pix_fmt: yuv420p

# 🔴 2026-09-08：改回 true —— 錄製時同時在 rerun 看兩路相機。
# 上面宣告幾台相機，rerun 就開幾格畫面：blueprint 是 grid，每個 image entity 一格
# （`observation.wrist`、`observation.front-left`）＋ observation / action 兩個時序圖。
# ⚠️ 不是 `observation.images.*` —— 那是 dataset 的 feature 名，不是 rerun 的 entity path。
# 代價：每幀多送 640×480 + 848×480 兩張 raw frame 給 viewer（@15fps ≈ 32 MB/s）。比 2026-08-31 餓死抓幀執行緒的
# AV1 編碼輕得多（image 走 static log，不累積記憶體），但不是零成本。
# 🔻 退回 false 的判準（任一出現就關掉，不要用感覺判斷）：
#   ① 終端出現 `Record loop is running slower (X Hz) than the target FPS`
#   ② `TimeoutError: latest frame is too old ...ms`（hardware.md §2026-08-31）
display_data: true
# 🔴 2026-09-13：不要開 JPEG 壓縮 —— 在 teleop 實測會把控制迴圈卡死；錄製迴圈同樣會被卡住（整集作廢）。
# 證據（2026-09-13，只連相機、不連手臂，同樣 2 台相機 / 30 Hz / 848×480 + 640×480）：
#   JPEG 壓縮：乾淨重現 2/2 次在 ~28 s 卡死（rr.log 不返回，`log_channel ... Sender has been blocked`），
#              實機 teleop 1/1 次卡死 → 迴圈停住 → follower 不再跟、rerun 無畫面。
#   raw      ：40 s、120 s 各 1 次，0 次卡死，rr.log 平均 3–4 ms；viewer 在 ~31 s 達 1 GiB 後丟最舊資料、持續正常。
#   壓縮在「送出端」很便宜（1.7–2.5 ms/幀），問題在 viewer 消化不了（[AI推論]，機制未查證）。
# 錄製時 rerun 若延遲或出現 `Sender has been blocked` → 直接 `display_data: false`，不要改壓縮。
display_compressed_images: false
