# 2026-10-16 uvc_60 ONLY + fldrop30-augfl: the 34/36 recipe of 2026-10-16 (aebc8680b965) on the original 60 episodes.
# Why [柏宇說]: is the extra data (normal_A1, recovery_A1_tight_cut, far_wrist_A1) needed, or are the 60 demos + this
# augmentation enough? -- docs/meeting/2026-10-16_closed_loop.md §4-1 (comparison and acceptance not decided there).
#
# Same as train_omx_cup_uvc60_normal_tightcut_far_A1_aug_fldrop.yaml except the dataset: image_transforms,
# hyper-parameters and seed are copied unchanged. Merged ep 0-59 of that dataset ARE uvc_60 ep 0-59 and none of them
# is in its exclude_episodes, so the 60 here are exactly the uvc_60 part of the 129.
# Against the old uvc_60 model act_omx_b1_uvc60_100k (2bdff2b3871e, configs/train_omx_phase_b1.yaml): same data, and
# that config left chunk_size / n_action_steps / seed at lerobot's defaults (100 / 100 / 1000) -- the differences are
# image_transforms, num_workers (speed only) and the dropout flags below.
# The dropout flags are not in this YAML (lerobot's parser would reject them); they go on the command line:
#
#   ./scripts/run_container.sh python scripts/train_fl_dropout.py --fl-p 0.3 --fl-window 30 --transforms-fl-only \
#       --config_path configs/train_omx_uvc60_augfl_fldrop.yaml
#
dataset:
  repo_id: ericc430/omx_pick_place_pilot_uvc_60
  root: /workspace/data/huggingface/lerobot/ericc430/omx_pick_place_pilot_uvc_60
  eval_split: 0.0
  image_transforms:          # copied from the aug config; with --transforms-fl-only they run on front-left only
    enable: true
    max_num_transforms: 1
    random_order: false
    tfs:
      brightness: {weight: 0.0, type: ColorJitter, kwargs: {brightness: [0.8, 1.2]}}
      contrast: {weight: 0.0, type: ColorJitter, kwargs: {contrast: [0.8, 1.2]}}
      saturation: {weight: 0.0, type: ColorJitter, kwargs: {saturation: [0.5, 1.5]}}
      hue: {weight: 0.0, type: ColorJitter, kwargs: {hue: [-0.05, 0.05]}}
      sharpness: {weight: 0.0, type: SharpnessJitter, kwargs: {sharpness: [0.5, 1.5]}}
      affine: {weight: 1.0, type: RandomAffine, kwargs: {degrees: [-2.0, 2.0], translate: [0.05, 0.05]}}
policy:
  type: act
  chunk_size: 100
  n_action_steps: 100
  push_to_hub: false
output_dir: /workspace/data/train/uvc60_augfl_fldrop_p30_w30
job_name: act_omx_uvc60_augfl_fldrop_p30_w30
steps: 100000
batch_size: 32
save_freq: 20000
eval_steps: 0
log_freq: 50
seed: 1000
num_workers: 12
wandb:
  enable: true
  project: teleoperation_pick_place
