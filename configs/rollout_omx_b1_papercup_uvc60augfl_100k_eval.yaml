# RECORDED closed-loop evaluation of ericc430/act_omx_b1_paper-cup_60-augfl-fldrop30_100k (paper cup, "u60augfl").
# Model: ACT 100k steps, sha256 f55b0fa71b50 (docs/models.md). Data = omx_pick_place_pilot_uvc_60 only (60 eps);
# augmentation/dropout same as fldrop30-augfl (front-left shift only, fl p 0.3, window 30). Why: 2026-10-16_closed_loop.md 4-1.
# Criterion: >= 29/36 (8 of 10). Comparison: fldrop30-augfl 100k 34/36 (10/16), act_omx_b1_uvc60_100k (2bdff2b3871e).
# Open loop (10-17): 100k worse than b1/augfl at N=100/50, not a criterion (2026-10-17_uvc60_augfl_open_loop.md).
# uvc_60 has no wrist-turn demos.
#
#   uv run python scripts/rollout_labeled.py --config_path configs/rollout_omx_b1_papercup_uvc60augfl_100k_eval.yaml --policy.path=ericc430/act_omx_b1_paper-cup_60-augfl-fldrop30_100k --policy.n_action_steps=30 --meta-template paper_cup_A1
#
# KEEP THIS FILE ASCII-ONLY (lerobot opens it as cp950 when policy.path is set).
# Copied from rollout_omx_b1_papercup_ntcfA1augflfldrop30_100k_eval.yaml; only policy.path and dataset.repo_id differ.
# Camera reference (far_wrist vs uvc_60 view) was undecided as of 10-17; see the meeting note for which one was used.

robot:
  type: omx_follower
  port: COM8
  id: 2026-10-08_omx_follower
  calibration_dir: ./calibration
  cameras:
    wrist:
      type: opencv_uvc
      index_or_path: 2
      backend: DSHOW
      width: 640
      height: 480
      fps: 15
      fourcc: YUY2
      exposure: -5
      gain: 0
      white_balance: null
    front-left:
      type: intelrealsense_pinned
      serial_number_or_name: "262822305610"
      width: 848
      height: 480
      fps: 15
      use_depth: false
      exposure: 400
      gain: 70
      white_balance: null

policy:
  path: ericc430/act_omx_b1_paper-cup_60-augfl-fldrop30_100k  # private; downloaded on first run

strategy:
  type: episodic
  reset_to_initial_position: true   # no teleop: arm goes back to its startup pose between trials

inference:
  type: sync

dataset:
  repo_id: ericc430/rollout_omx_b1_papercup_60_augfl_fldrop30_100k_nas30_paper_cup   # must start with rollout_; timestamp appended; nas30 = n_action_steps (keep in sync with the CLI)
  single_task: "Pick up the object and place it into the box"   # same string as training
  fps: 15                  # must match camera fps
  num_episodes: 36         # same as 10-06 / 10-08 (template paper_cup_A1 = c1..c36)
  episode_time_s: 30
  reset_time_s: 120        # time to re-place the cup; Right/Up ends it early
  video: true
  push_to_hub: false       # upload later by hand once the session looks right
  private: true
  streaming_encoding: false
  encoder_threads: 2
  rgb_encoder:
    vcodec: h264
    preset: veryfast
    crf: 23
    pix_fmt: yuv420p

fps: 15
task: "Pick up the object and place it into the box"
display_data: true
return_to_initial_position: true
