# RECORDED closed-loop evaluation of ericc430/act_omx_b1_paper-cup_60-13-10rcvrycut-46far-aug_100k (paper cup, "ntcfA1-aug"), TEMPORAL ENSEMBLING (n_action_steps=1, coeff 0.01).
# Model: ACT 100k steps on uvc_60 + normal_A1 + recovery_A1_tight_cut + far_wrist_A1 (129 eps after exclusions),
# chunk_size 100, sha256 286a49c37d4e. Same data/hyper-parameters/seed as ntcfA1 (0319057c1d65); only adds
# dataset.image_transforms RandomAffine (translate 0.05, degrees 2) -- docs/handoff/2026-10-13_aug_retrain.md.
# h6_turn_cue.py (2026-10-13): normal_A1 FL shifted 0/13 turn (median +8.1 -> +8.1); far_wrist 10/12 -> 10/12.
# 20k (e0894f917c32) and 40k (f877d679843f) are on the Hub as ..-aug_20k / ..-aug_40k.
# Run it with scripts/rollout_labeled.py (verdict keys -> episode_meta CSV):
#
#   uv run python scripts/rollout_labeled.py --config_path configs/rollout_omx_b1_papercup_ntcfA1aug_100k_te001_eval.yaml --policy.path=ericc430/act_omx_b1_paper-cup_60-13-10rcvrycut-46far-aug_100k --policy.n_action_steps=1 --policy.temporal_ensemble_coeff=0.01 --meta-template paper_cup_A1
#
# KEEP THIS FILE ASCII-ONLY (lerobot opens it as cp950 when policy.path is set).
# policy.n_action_steps (and here temporal_ensemble_coeff) must be given on the command line with --policy.path (2026-10-05 note).
# Same overrides as the 10-07 temporal-ensemble run (record config_records/2026-09-17_omx_follower/..__db8635ae);
# lerobot rejects temporal ensembling with n_action_steps > 1. Check: a full 30 s episode should still have ~450 frames.
# Copied from rollout_omx_b1_papercup_ntcfA1aug_100k_eval.yaml; only dataset.repo_id (nas30 -> nas1_te001) differs in the YAML.
# Comparison target: the N=30 ntcfA1aug 100k run on 10-13 (record __98627c1e, 25/36, chunk_gap_rush 6).
# Before running, in this order: read_joint_pose.py --goto-home --home-episode 10, lerobot-find-cameras opencv (wrist index),
# align_camera.py --dataset-root .cache/lerobot/omx_pick_place_pilot_paper_cup_far_wrist_A1 --episodes 1 4 8
# (far_wrist view, recorded 10-08 night; frame 0 of ep 1/4/8 has the arm within 1.4 deg of the far_wrist start pose.)

robot:
  type: omx_follower
  port: COM8
  id: 2026-10-08_omx_follower
  calibration_dir: ./calibration
  cameras:
    wrist:
      type: opencv_uvc
      index_or_path: 2
      backend: DSHOW
      width: 640
      height: 480
      fps: 15
      fourcc: YUY2
      exposure: -5
      gain: 0
      white_balance: null
    front-left:
      type: intelrealsense_pinned
      serial_number_or_name: "262822305610"
      width: 848
      height: 480
      fps: 15
      use_depth: false
      exposure: 400
      gain: 70
      white_balance: null

policy:
  path: ericc430/act_omx_b1_paper-cup_60-13-10rcvrycut-46far-aug_100k  # private; cached at D:\hf\hub (downloaded 2026-10-13)

strategy:
  type: episodic
  reset_to_initial_position: true   # no teleop: arm goes back to its startup pose between trials

inference:
  type: sync

dataset:
  repo_id: ericc430/rollout_omx_b1_papercup_60_13_10rcvrycut_46far_aug_100k_nas1_te001_paper_cup   # must start with rollout_; timestamp appended; nas1_te001 = n_action_steps 1 + temporal_ensemble_coeff 0.01 (keep in sync with the CLI)
  single_task: "Pick up the object and place it into the box"   # same string as training
  fps: 15                  # must match camera fps
  num_episodes: 36         # same as 10-06 / 10-08 (template paper_cup_A1 = c1..c36)
  episode_time_s: 30
  reset_time_s: 120        # time to re-place the cup; Right/Up ends it early
  video: true
  push_to_hub: false       # upload later by hand once the session looks right
  private: true
  streaming_encoding: false
  encoder_threads: 2
  rgb_encoder:
    vcodec: h264
    preset: veryfast
    crf: 23
    pix_fmt: yuv420p

fps: 15
task: "Pick up the object and place it into the box"
display_data: true
return_to_initial_position: true
