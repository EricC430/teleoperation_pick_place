# RECORDED closed-loop evaluation of ericc430/act_omx_cup129-bottle135-aimfix28-twoobj10-augfl-fldrop30_300k
# (M-full 264 eps + aimfix_A1_cut 28 + twoobj_A1 10 = 311 eps, sha256 b431d2172af2, docs/models.md; Hub upload 2026-11-18). Object: paper_cup.
# Same run as configs/rollout_omx_aimfix_200k_te-001_paper_cup_eval.yaml (200k, never run on the cup), final 300k checkpoint.
# config.json and train_config.json of 200k and 300k are identical (checked 2026-11-18); only the weights differ.
# TEMPORAL ENSEMBLING (n_action_steps=1, coeff -0.01), same inference as the 300k bottle file.
# Episode 30 s for the cup, NOT 45 s like the bottle file [Boyu 2026-11-11: "cup first, 30 first"]: same length as the
# cup 34/36 run. Check: a full 30 s episode should have ~450 frames.
# NEGATIVE coeff: the sign is not visible in 'te001'-style names, so the repo says te-001; the config record is the truth.
# Training: configs/train_omx_cup129_bottle135_aimfix28_twoobj10_augfl_fldrop.yaml (300k steps, saves every 100k).
# Gate (docs/phase_plan.md stage 0): BOTH objects >= 29/36 (80%) [Boyu]. Bottle 300k (v4 list): 29/36, 2026-11-18
#   (D:/hf/lerobot/ericc430/rollout_omx_aimfix28_twoobj10_300k_nas1_te-001_plastic_bottle_20261118_141713).
# Comparison: M-full 200k, same inference: cup 29/36 (11/11). Cup list = c1..c36, template paper_cup_A1.
#
#   uv run python scripts/rollout_labeled.py --config_path configs/rollout_omx_aimfix_300k_te-001_paper_cup_eval.yaml --policy.path=ericc430/act_omx_cup129-bottle135-aimfix28-twoobj10-augfl-fldrop30_300k --policy.n_action_steps=1 --policy.temporal_ensemble_coeff=-0.01 --meta-template paper_cup_A1
#
# KEEP THIS FILE ASCII-ONLY (lerobot opens it as cp950 when policy.path is set).
# policy.n_action_steps and temporal_ensemble_coeff must be given on the command line with --policy.path (2026-10-05 note).
# Copied from configs/rollout_omx_aimfix_200k_te-001_paper_cup_eval.yaml; only policy.path, dataset.repo_id and comments differ.
# Model input_features (config.json, 300k): state [6], wrist [3,480,640], front-left [3,480,848] - same as the robot block.
# Before running, in this order: read_joint_pose.py --goto-home --home-episode 10, lerobot-find-cameras opencv (wrist index),
# align_camera.py --dataset-root .cache/lerobot/omx_pick_place_pilot_paper_cup_far_wrist_A1 --episodes 1 4 8
robot:
  type: omx_follower
  port: COM8
  id: 2026-10-08_omx_follower
  calibration_dir: ./calibration
  cameras:
    wrist:
      type: opencv_uvc
      index_or_path: 2
      backend: DSHOW
      width: 640
      height: 480
      fps: 15
      fourcc: YUY2
      exposure: -5
      gain: 0
      white_balance: null
    front-left:
      type: intelrealsense_pinned
      serial_number_or_name: "262822305610"
      width: 848
      height: 480
      fps: 15
      use_depth: false
      exposure: 400
      gain: 70
      white_balance: null

policy:
  path: ericc430/act_omx_cup129-bottle135-aimfix28-twoobj10-augfl-fldrop30_300k  # private; cached in D:/hf/hub (sha256 b431d2172af2 checked 2026-11-18)

strategy:
  type: episodic
  reset_to_initial_position: true   # no teleop: arm goes back to its startup pose between trials

inference:
  type: sync

dataset:
  repo_id: ericc430/rollout_omx_aimfix28_twoobj10_300k_nas1_te-001_30s_paper_cup   # must start with rollout_; timestamp appended; nas1 + coeff -0.01 (keep in sync with the CLI)
  single_task: "Pick up the object and place it into the box"   # same string as training
  fps: 15                  # must match camera fps
  num_episodes: 36         # eval-close c1..c36 (template paper_cup_A1)
  episode_time_s: 30       # Boyu 2026-11-11: cup at 30 s first (same as the 34/36 cup run); the bottle file stays 45 s
  reset_time_s: 120        # time to re-place the object; Right/Up ends it early
  video: true
  push_to_hub: false       # upload later by hand once the session looks right
  private: true
  streaming_encoding: false
  encoder_threads: 2
  rgb_encoder:
    vcodec: h264
    preset: veryfast
    crf: 23
    pix_fmt: yuv420p

fps: 15
task: "Pick up the object and place it into the box"
display_data: true
return_to_initial_position: true
