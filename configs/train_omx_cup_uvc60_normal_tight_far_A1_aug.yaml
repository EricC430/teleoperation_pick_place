# 2026-10-13 AUGMENTED version of train_omx_cup_uvc60_normal_tight_far_A1.yaml: identical data, exclude_episodes, hyper-parameters and seed;
# the ONLY change is dataset.image_transforms (the original trained with image_transforms.enable = false,
# checked in the Hub train_config.json of act_omx_b1_paper-cup_60-13-10rcvry-46far_100k).
# Why (docs/handoff/2026-10-13_aug_retrain.md): in the far_wrist A1 camera position all 46 demos turn the wrist and
# none is near/mid, so the model also uses "where the camera sits" to decide the wrist turn. Shifting front-left
# by the 20 px that separates the 10-07 and far_wrist views flips the decision for near cups. Random shifts make the
# absolute camera position useless while keeping the cup-to-arm relation (cup and arm move together).
# translate 0.05 = +-42 px x / +-24 px y on the 848x480 front-left (2x the 20 px seen); degrees +-2 covers the
# ~1.2 deg roll seen between sessions (scripts/align_camera.py docstring). lerobot applies it to EVERY camera with
# independent draws (datasets/dataset_reader.py), so the wrist image is shifted too.
#
#   ./scripts/run_container.sh lerobot-train --config_path configs/train_omx_cup_uvc60_normal_tight_far_A1_aug.yaml
#
# ---- header of the base config, unchanged below ----
# ACT on paper cup: uvc_60 + 10-07 normal 16 + 10-07 recovery_tight 13 + 10-08/09 far-wrist 48 (= 137 episodes).
#
# Training handoff 2026-10-09 (far-wrist re-recording; rationale in docs/meeting/2026-10-08.md §8).
# Main version. Control version (also drops uvc_60's r >= 35.5 side-hook demos):
#   configs/train_omx_cup_uvc60_normal_tight_far_A1_no_uvc_far.yaml
# Hyper-parameters identical to configs/train_omx_cup_uvc60_normal_tight_A1.yaml
# (= Hub act_omx_b1_paper-cup_60-16-12rcvry_100k, `e6ef7c0e9528` in docs/models.md); only the data changes.
#
# Merged locally 2026-10-09 with `lerobot-edit-dataset --operation.type merge`, in this order
# (log: data/merge_cup_uvc60_normal_tight_far_A1.log; 137 eps / 43206 frames = sum of sources;
#  per-episode action arrays checked identical to the sources):
#   merged ep   0-59  <- ericc430/omx_pick_place_pilot_uvc_60                        ep 0-59
#   merged ep  60-75  <- ericc430/omx_pick_place_pilot_paper_cup_normal_A1           ep 0-15
#   merged ep  76-88  <- ericc430/omx_pick_place_pilot_paper_cup_recovery_A1_tight   ep 0-12
#   merged ep  89-136 <- ericc430/omx_pick_place_pilot_paper_cup_far_wrist_A1        ep 0-47
# Frame counts checked against the handoff: 73/74/75 = 268/272/286, 85/86/87 = 415/346/900, 98 = 269, 135 = 675.
# Not on the Hub; reproducible from the four source repos with the command above.
#
# exclude_episodes:
#   73, 74, 75 = normal_A1 ep 13-15 (t2, t20, t45), 85, 86 = tight ep 9-10 (t9, t35): old side-hook grasp
#     at the far points, same camera position as the new wrist-turn demos -> two grasps, no cue to tell them apart.
#   87 = tight ep 11, camera dropout (excluded since the 10-07 run).
#   98 = far ep 9, failed attempt at t65's original position (gripper never closed).
#   135 = far ep 46, empty episode left by the missed t68 in pass 2.
#
dataset:
  repo_id: ericc430/omx_pick_place_pilot_paper_cup_uvc60_normalA1_tightA1_farwristA1   # local only
  root: /workspace/data/huggingface/lerobot/ericc430/omx_pick_place_pilot_paper_cup_uvc60_normalA1_tightA1_farwristA1
  exclude_episodes: [73, 74, 75, 85, 86, 87, 98, 135]   # -> 129 of 137 remain
  eval_split: 0.0
  image_transforms:          # 2026-10-13: random shift/rotate only (see the header); every other transform weight 0
    enable: true
    max_num_transforms: 1
    random_order: false
    tfs:
      brightness: {weight: 0.0, type: ColorJitter, kwargs: {brightness: [0.8, 1.2]}}
      contrast: {weight: 0.0, type: ColorJitter, kwargs: {contrast: [0.8, 1.2]}}
      saturation: {weight: 0.0, type: ColorJitter, kwargs: {saturation: [0.5, 1.5]}}
      hue: {weight: 0.0, type: ColorJitter, kwargs: {hue: [-0.05, 0.05]}}
      sharpness: {weight: 0.0, type: SharpnessJitter, kwargs: {sharpness: [0.5, 1.5]}}
      affine: {weight: 1.0, type: RandomAffine, kwargs: {degrees: [-2.0, 2.0], translate: [0.05, 0.05]}}
policy:
  type: act
  chunk_size: 100
  n_action_steps: 100
  push_to_hub: false
output_dir: /workspace/data/train/cup_uvc60_normal_tight_far_A1_aug
job_name: act_omx_cup_uvc60_normal_tight_far_A1_aug
steps: 100000
batch_size: 32
save_freq: 20000
eval_steps: 0
log_freq: 50
seed: 1000
num_workers: 12   # 2026-10-13: was 4; with the CPU-side RandomAffine, 4 workers left the GPU waiting (data_s 0.25 of step_s 0.55)
wandb:
  enable: true
  project: teleoperation_pick_place
