#
# Check after the merge: 311 eps / 111530 frames (98959 + 6045 + 6526); ep 0-272 length and frame-0 action equal to
# omx_pick_place_pilot_cup129_bottle135. Stop if not.
# Expected fl_dropout.json (close_below 54, laptop numbers 2026-11-15, aimfix part recomputed 2026-11-16):
# episodes 302, episodes_without_close [277, 289] (= aimfix ep 4 / 16 1st halves, 11 / 8 frames, no close - expected),
# frames 108380, frames_in_window 8362 (M-full 7372 + aimfix 780 + twoobj 210), expected_masked_fraction ~0.0231.
#   aimfix: every first close < 54 is the real grasp (60-146 frames in); the 短 episodes start at 55.6-60.9 after
#   the trial close, so the leftover trial close is not counted.
#   ⚠️ twoobj ep 1, 4, 7 (merged 302, 305, 308) start with the gripper already below 54 (47.5-51 at frame 0) ->
#   first close = 0, NO dropout window for them. 3 of 10 eps; left as is (changing first_close would change M-full's
#   numbers too).
#
# steps 300000, save_freq 100000 [柏宇決定 2026-11-16] -> checkpoints 100k / 200k / 300k. M-full = 200k; constant lr (no scheduler),
# so the 200k checkpoint here is the one comparable to M-full 200k (same steps). 200k ~ 59 epochs here (M-full ~67), 300k ~ 89.
#
dataset:
  repo_id: ericc430/omx_pick_place_pilot_cup129_bottle135_aimfix28_twoobj10   # local only
  root: /workspace/data/huggingface/lerobot/ericc430/omx_pick_place_pilot_cup129_bottle135_aimfix28_twoobj10
  exclude_episodes: [73, 74, 75, 85, 86, 87, 98, 135, 271]   # same as M-full -> 302 of 311 remain
  eval_split: 0.0
  image_transforms:          # copied from M-full; with --transforms-fl-only they run on front-left only
    enable: true
    max_num_transforms: 1
    random_order: false
    tfs:
      brightness: {weight: 0.0, type: ColorJitter, kwargs: {brightness: [0.8, 1.2]}}
      contrast: {weight: 0.0, type: ColorJitter, kwargs: {contrast: [0.8, 1.2]}}
      saturation: {weight: 0.0, type: ColorJitter, kwargs: {saturation: [0.5, 1.5]}}
      hue: {weight: 0.0, type: ColorJitter, kwargs: {hue: [-0.05, 0.05]}}
      sharpness: {weight: 0.0, type: SharpnessJitter, kwargs: {sharpness: [0.5, 1.5]}}
      affine: {weight: 1.0, type: RandomAffine, kwargs: {degrees: [-2.0, 2.0], translate: [0.05, 0.05]}}
policy:
  type: act
  chunk_size: 100
  n_action_steps: 100
  push_to_hub: false
output_dir: /workspace/data/train/cup129_bottle135_aimfix28_twoobj10_augfl_fldrop_p30_w30
job_name: act_omx_cup129_bottle135_aimfix28_twoobj10_augfl_fldrop_p30_w30
steps: 300000
batch_size: 32
save_freq: 100000
eval_steps: 0
log_freq: 50
seed: 1000
num_workers: 12
wandb:
  disable_artifact: true
  enable: true
  project: teleoperation_pick_place
