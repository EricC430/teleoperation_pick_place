# RECORDED real-robot (closed-loop) evaluation of ACT ericc430/act_omx_alcan60_fixed_40k.
# Object: aluminium can. Placements: eval-close c1..c36 of campA_136sym_20260908.
#
#   uv run lerobot-rollout --config_path configs/rollout_omx_alcan_fixed_40k_eval.yaml
#
# KEEP THIS FILE ASCII-ONLY: lerobot's parser opens the YAML with the Windows default
# encoding (cp950) when the config has a path field (policy.path) -> non-ASCII comments crash it.
#
# The robot block is copied VERBATIM from the recording config that produced the training data,
# config_records/2026-09-18_omx_follower/record_omx__4258512d.yaml (repo_id
# omx_pick_place_pilot_60_alcan, 60 episodes). The model's input_features confirm it needs both
# cameras and these exact sizes (read off its config.json 2026-09-20):
#   observation.state             [6]
#   observation.images.wrist      [3, 480, 640]
#   observation.images.front-left [3, 480, 848]
# Calibration: 2026-09-18_omx_follower.json is byte-identical to 2026-09-17_omx_follower.json.
#
# ACT re-plans every n_action_steps=100 frames = 6.67 s at 15 fps (chunk_size 100).
# image_transforms was OFF during training (train_config.json), so the scene must look like the
# training scene: same lighting, and NO placement mat in frame (docs/assets/placement_card_*.md 6).
#
# Check before every session: wrist OpenCV index (lerobot-find-cameras) -- 2 on 2026-09-17/18,
# 3 on 2026-09-13. D455 is found by serial, nothing to index there.
#
# Flow per trial: place the can on cross c<N> -> remove the mat -> policy runs up to
# episode_time_s -> arm returns to its start pose -> reset_time_s to re-place for the next trial.
# Keys (episodic): Right arrow = end episode / skip reset, Left arrow = discard and redo,
#   Esc = stop the session (saved episodes are kept).
# Dataset name must start with "rollout_"; lerobot appends _YYYYMMDD_HHMMSS. root left unset ->
# D:\hf\lerobot\ericc430\rollout_omx_alcan_fixed_40k_<stamp>.

robot:
  type: omx_follower
  port: COM8
  id: 2026-09-18_omx_follower
  calibration_dir: ./calibration
  cameras:
    wrist:
      type: opencv_uvc
      index_or_path: 2
      backend: DSHOW
      width: 640
      height: 480
      fps: 15
      fourcc: YUY2
      exposure: -5
      gain: 0
      white_balance: null
    front-left:
      type: intelrealsense_pinned
      serial_number_or_name: "262822305610"
      width: 848
      height: 480
      fps: 15
      use_depth: false
      exposure: 400
      gain: 70
      white_balance: null

policy:
  path: ericc430/act_omx_alcan60_fixed_100k  # private; already cached in D:\hf\hub

strategy:
  type: episodic
  reset_to_initial_position: true   # no teleop: arm goes back to its startup pose between trials

inference:
  type: sync

dataset:
  repo_id: ericc430/rollout_omx_alcan_fixed_100k   # must start with rollout_; timestamp appended
  single_task: "Pick up the object and place it into the box"   # same string as training
  fps: 15                  # must match camera fps
  num_episodes: 36         # eval-close c1..c36 of campA_136sym_20260908
  episode_time_s: 35       # 2026-09-20: was 20 (copied from the paper-cup protocol, where demos
                           # average 17.7 s). The alcan demos average 26.7 s / median 25.1 / p90 36.5
                           # (meta/episodes/*.parquet, 56 kept eps), so 20 s cut off 82% of them and
                           # would have logged them as mechanism=timeout. 35 s covers 91%.
                           # This is an UPPER bound: press Right arrow the moment a trial is decided.
  reset_time_s: 120        # time to re-place the can; Right arrow skips the rest
  video: true
  push_to_hub: false       # upload later by hand once the session looks right
  private: true            # personal account: without this a push would be PUBLIC
  streaming_encoding: false
  encoder_threads: 2
  rgb_encoder:
    vcodec: h264
    preset: veryfast
    crf: 23
    pix_fmt: yuv420p

fps: 15
task: "Pick up the object and place it into the box"
display_data: true
return_to_initial_position: true
